name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 package.json의 packageManager 필드를 따른다.
      - uses: pnpm/action-setup@v6

      # Node 버전은 .nvmrc를 따른다. 로컬과 같은 파일을 읽어 버전이 갈리지 않게 한다.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run format:check

      - run: pnpm exec tsc --noEmit

      # vitest는 CI 환경 변수로 watch를 끄지만, 그 감지에 기대지 않고 명시한다.
      - run: pnpm exec vitest run
