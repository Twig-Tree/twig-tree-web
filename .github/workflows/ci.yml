name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json의 packageManager 필드를 따른다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run format:check

      - run: pnpm exec tsc --noEmit

      # vitest는 CI 환경 변수로 watch를 끄지만, 그 감지에 기대지 않고 명시한다.
      - run: pnpm exec vitest run
